<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="Terminal: whoami → Harun Yahya Koç, Automation Developer">
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #e6edf3; }
    .g { fill: #3fb950; } .p { fill: #79c0ff; } .m { fill: #8b949e; }
    .name { font-size: 24px; font-weight: 700; fill: #d2a8ff; }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="819" height="299" rx="10" fill="#0b0f14" stroke="#30363d"/>
  <path d="M10.5 0.5h799a10 10 0 0 1 10 10v24.5h-819v-24.5a10 10 0 0 1 10-10z" fill="#161b22"/>
  <line x1="0.5" y1="35" x2="819.5" y2="35" stroke="#30363d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="86" y="22" class="t m" style="font-size:12px">harun@github: ~</text>

  <!-- clip rects used for the typing effect -->
  <defs>
    <clipPath id="c1"><rect x="0" y="45" height="30" width="0"><animate attributeName="width" from="0" to="820" begin="0.3s" dur="0.6s" fill="freeze" calcMode="discrete" values="0;177;186;195;204;213;820" keyTimes="0;0.16;0.33;0.5;0.66;0.83;1"/></rect></clipPath>
    <clipPath id="c4"><rect x="0" y="135" height="30" width="0"><animate attributeName="width" begin="1.9s" dur="0.9s" fill="freeze" calcMode="discrete" values="0;186;204;222;249;267;285;303;820" keyTimes="0;0.12;0.24;0.36;0.48;0.6;0.72;0.86;1"/></rect></clipPath>
    <clipPath id="c5"><rect x="0" y="165" height="26" width="0"><animate attributeName="width" from="0" to="480" begin="3.1s" dur="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="0" y="191" height="26" width="0"><animate attributeName="width" from="0" to="620" begin="4.6s" dur="1.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="0" y="217" height="26" width="0"><animate attributeName="width" from="0" to="540" begin="6.3s" dur="1.4s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- $ whoami -->
  <g opacity="0">
    <animate attributeName="opacity" to="1" begin="0.1s" dur="0.01s" fill="freeze"/>
    <text x="24" y="66" class="t"><tspan class="g">harun@github</tspan>:<tspan class="p">~</tspan>$ </text>
  </g>
  <text x="168" y="66" class="t" clip-path="url(#c1)">whoami</text>

  <!-- name + role -->
  <g opacity="0">
    <animate attributeName="opacity" to="1" begin="1.1s" dur="0.01s" fill="freeze"/>
    <text x="24" y="98" class="t name">Harun Yahya Koç</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" to="1" begin="1.3s" dur="0.01s" fill="freeze"/>
    <text x="24" y="122" class="t m">Automation Developer · Python · Trabzon, TR</text>
  </g>

  <!-- $ cat about.txt -->
  <g opacity="0">
    <animate attributeName="opacity" to="1" begin="1.7s" dur="0.01s" fill="freeze"/>
    <text x="24" y="156" class="t"><tspan class="g">harun@github</tspan>:<tspan class="p">~</tspan>$ </text>
  </g>
  <text x="168" y="156" class="t" clip-path="url(#c4)">cat about.txt</text>

  <text x="24" y="184" class="t" clip-path="url(#c5)">I build tools that do the boring work for you.</text>
  <text x="24" y="210" class="t" clip-path="url(#c6)">Web scrapers, Telegram bots and data pipelines in Python,</text>
  <text x="24" y="236" class="t" clip-path="url(#c7)">with a robotics background from autonomous drones.</text>

  <!-- final prompt + blinking cursor -->
  <g opacity="0">
    <animate attributeName="opacity" to="1" begin="7.9s" dur="0.01s" fill="freeze"/>
    <text x="24" y="272" class="t"><tspan class="g">harun@github</tspan>:<tspan class="p">~</tspan>$ </text>
    <rect x="168" y="259" width="9" height="17" fill="#3fb950">
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
